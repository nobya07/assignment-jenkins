<!DOCTYPE html>
<html>
<head>
  <title>DevOps App</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #74ebd5, #ACB6E5);
      text-align: center;
      padding: 50px;
    }

    .container {
      background: white;
      padding: 30px;
      width: 400px;
      margin: auto;
      border-radius: 10px;
      box-shadow: 0px 0px 10px gray;
    }

    input {
      width: 90%;
      padding: 10px;
      margin: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      background: #4CAF50;
      color: white;
      padding: 10px 20px;
      margin: 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #45a049;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      background: #f2f2f2;
      padding: 10px;
      margin: 5px;
      border-radius: 5px;
    }
  </style>

</head>
<body>

<div class="container">

<h2>DevOps User Management</h2>

<input type="text" id="name" placeholder="Enter Name"><br>
<input type="text" id="role" placeholder="Enter Role"><br>

<button onclick="addData()">Add Data</button>
<button onclick="getData()">Fetch Data</button>

<h3>Users List</h3>

<ul id="list"></ul>

</div>

<script>

async function addData(){
  let name = document.getElementById("name").value;
  let role = document.getElementById("role").value;

  await fetch("/add", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({name, role})
  });

  alert("Data Added");
}

async function getData(){
  let res = await fetch("/get");
  let data = await res.json();

  let list = document.getElementById("list");
  list.innerHTML="";

  data.forEach(user=>{
    let li = document.createElement("li");
    li.innerText = user.name + " - " + user.role;
    list.appendChild(li);
  });
}

</script>

</body>
</html>
